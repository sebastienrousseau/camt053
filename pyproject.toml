[tool.poetry]
name = "camt053"
version = "0.0.24"
description = "Camt053 is a Python library for reading ISO 20022 camt Bank-to-Customer Statements (camt.053/052/054) and generating validated reversing entries by return reason code (e.g. AC04 Closed Account)."
authors = ["Sebastien Rousseau <sebastian.rousseau@gmail.com>"]
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/sebastienrousseau/camt053"
homepage = "https://sebastienrousseau.github.io/camt053/"
packages = [
    { include = "camt053" },
]
include = [
    "camt053/schemas/*",
    "camt053/templates/*",
    "camt053/templates/**/*",
    "camt053/xsd/*",
    "camt053/py.typed",
]

[tool.poetry.scripts]
camt053 = "camt053.__main__:main"

[tool.poetry.dependencies]
click = ">=8.1,<9"
colorama = "0.4.6"
defusedxml = "0.7.1"
jinja2 = "3.1.6"
markupsafe = ">=2.1,<4"
pygments = ">=2.20.0,<3.0.0"
python = ">=3.11,<4.0"
rich = ">=13.7.1,<16"
xmlschema = ">=4.3.2,<5.0.0"
# Optional: when present, libxml2 validates a camt document ~31x faster
# than the pure-Python validator. Auto-detected — nothing changes if it
# is absent, and it can never turn a rejected document into an accepted
# one.
# The floor is GHSA-vfmq-68hx-4jfw (iterparse and ETCompatXMLParser
# defaults, fixed in 6.1.0).
lxml = {version = ">=6.1.0,<7", optional = true}
jsonschema = ">=4.20,<4.27"
# The REST API. fastapi's floor is PYSEC-2024-38 (fixed in 0.109.1);
# camt053.api imports starlette and pydantic directly, so both are
# declared, floored at GHSA-82w8-qh3p-5jfq (starlette 1.3.1, which also
# clears GHSA-86qp-5c8j-p5mr and GHSA-jp82-jpqv-5vv3) and
# GHSA-mr82-8j83-vxmv (pydantic 2.4.0).
fastapi = ">=0.109.1,<1"
starlette = ">=1.3.1,<2"
pydantic = ">=2.4.0,<3"
uvicorn = {version = ">=0.20,<1", extras = ["standard"]}
httpx = ">=0.23,<1"
# Advisory floors, not feature requirements. Each package arrives only
# through the web stack above, whose own ranges still admit releases
# with a published advisory; declaring the floor here keeps an affected
# version from resolving for anyone who installs camt053.
# - anyio: GHSA-82r6-8w77-94w6 (critical, TLS host name spoofing),
#   GHSA-3w57-8xmc-8v26 and GHSA-5p39-cfhj-2xmp, fixed in 4.14.2.
# - cryptography: GHSA-g6cj-pr64-35w5 (PKCS#7 Bleichenbacher oracle),
#   GHSA-jwv3-5hgf-82ww and GHSA-m2h6-j472-rp4c, fixed in 50.0.0.
# - h11: GHSA-vqfr-h8mv-ghfj (request smuggling), fixed in 0.16.0.
# - idna: GHSA-65pc-fj4g-8rjx, fixed in 3.15.
# - python-dotenv: GHSA-mf9w-mj56-hr94, fixed in 1.2.2 (uvicorn[standard]).
# - pyyaml: GHSA-8q59-q68h-6hv4, fixed in 5.4 (uvicorn[standard]).
# - certifi: GHSA-248v-346w-9cwc (distrusted root), fixed in 2024.7.4;
#   GHSA-6q48-6c7w-9gw2 (emSign ECC Root CA - G3, compromised
#   intermediates), fixed in 2026.10.19.
#   certifi is calendar-versioned and must stay current, so it is the
#   one runtime range without an upper bound.
anyio = ">=4.14.2,<5"
cryptography = ">=50.0.0,<51.0.0"
h11 = ">=0.16.0,<1"
idna = ">=3.15,<4"
python-dotenv = ">=1.2.2,<2"
pyyaml = ">=5.4,<7"
certifi = ">=2026.10.19"
# Note: jsonschema is held at >=4.20 so the core library is co-installable with
# the camt053-mcp companion package (which requires the MCP SDK / jsonschema>=4.20).

# Optional: OpenTelemetry tracing + metrics. Off by default; install via
# ``pip install camt053[telemetry]``. The library gracefully degrades to
# a zero-overhead no-op when the API is absent.
opentelemetry-api = {version = ">=1.20,<2", optional = true}

[tool.poetry.extras]
fast = ["lxml"]
telemetry = ["opentelemetry-api"]

[tool.poetry.group.dev.dependencies]
# Required by the suite conformance and requirements drift tests, which
# parse requirement and version strings with it.
packaging = ">=23"
# So scripts/preflight_release.py can actually run its audit. Without it
# the pre-flight correctly refuses to audit (rather than auditing some
# other environment that happens to have pip-audit on PATH), but that
# means the check never runs locally. CI installs its own hash-pinned
# copy; this is for the pre-flight. filelock arrives through its
# cachecontrol and is floored for GHSA-9vhv-jxww-xfm5,
# GHSA-567q-5qvw-pf92 and GHSA-v4x8-3wr5-3wq8 (fixed in 4.2.1);
# msgpack, the same way, for GHSA-j586-36cw-2gc2 (fixed in 1.2.3).
pip-audit = ">=2.7"
filelock = ">=4.2.1"
msgpack = ">=1.2.3"
lxml = ">=6.1.0,<7"
pytest = ">=9.0.3,<10.0.0"
pytest-cov = ">=6.0.0,<8.0.0"
pytest-benchmark = ">=5.0.0,<6.0.0"
pytest-xdist = ">=3.6.0,<4.0.0"
interrogate = "^1.7"
black = "^26.3.1"
flake8 = "^7.0.0"
isort = ">=5.13,<10.0"
mypy = ">=1.11,<3.0"
pylint = ">=3,<5"
bandit = "^1.7.0"
ruff = ">=0.1,<0.18"
types-defusedxml = "^0.7.0"
types-setuptools = ">=65,<85"
hypothesis = "^6.0.0"
mutmut = "^3.0.0"
sphinx = ">=7,<9"
sphinx-rtd-theme = ">=1,<4"
sphinx-autodoc-typehints = ">=1,<4"
twine = ">=6.2.0,<8"
types-jsonschema = "^4.26.0.20260109"
# Advisory floors for tools that arrive transitively (twine and
# requests, pip-audit). They keep an affected version from resolving:
# urllib3 GHSA-vxq7-64xx-v4gw and GHSA-gh4c-6fx4-qh6g (fixed in 2.8.0),
# pip GHSA-qwm4-qh6w-59xr (fixed in 26.2).
urllib3 = ">=2.8.0"
pip = ">=26.2"
# starlette.testclient (behind fastapi.testclient in the API tests) warns
# that driving it with httpx is deprecated and looks for httpx2 first.
httpx2 = ">=2.15,<3"
# The complexity gate (scripts/check_complexity.py) and its tests. Pinned
# to the versions in requirements/complexity.txt, which the CI job uses,
# so the metrics the tests see are the metrics the gate sees.
radon = "6.0.1"
complexipy = {version = "8.1.0", python = "<3.16"}

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
sphinx = ">=7,<9"
pydata-sphinx-theme = ">=0.15,<0.20"
sphinx-autodoc-typehints = ">=1,<4"
sphinx-design = "^0.6.0"
myst-parser = ">=2,<5"
# Advisory floor: soupsieve arrives through pydata-sphinx-theme's
# beautifulsoup4; releases before 2.9 carry GHSA-gjv8-xp57-g29c and
# GHSA-j934-xhv5-fg8f (polynomial-time ReDoS).
soupsieve = ">=2.9"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# tests/test_suite_conformance.py is generated and vendored from one
# canonical copy shared across the suite, and checksummed by its own
# test. The suite uses three different line lengths, so letting each
# repository's formatter rewrite it would make the checksum
# unsatisfiable everywhere. Excluded as any generated file would be.
[tool.black]
line-length = 79
extend-exclude = "tests/test_suite_conformance\\.py"
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 79
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
combine_as_imports = true
known_first_party = "camt053"
known_third_party = "xmlschema"
skip = ["tmp_env", ".venv", ".git", ".eggs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "--cov=camt053",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=xml",
    "--cov-report=html",
    "--cov-fail-under=100",
    "--tb=short",
    "-ra",
    "--strict-markers",
    "--disable-warnings",
    # Benchmarks (marker ``perf``) and load/stress tests (marker ``stress``)
    # are excluded from the coverage gate; they run on their own in the CI
    # ``performance`` job (see #11). Select them explicitly with
    # ``-m perf --benchmark-only --no-cov`` / ``-m stress --no-cov``.
    "-m", "not perf and not stress"
]
markers = [
    "integration: end-to-end workflow tests",
    "message_compat: camt message family compatibility tests",
    "slow: tests taking > 1s",
    "security: XXE and injection prevention tests",
    "perf: performance/benchmark tests",
    "stress: load/stress and soak tests (excluded from the coverage gate)",
    "smoke: quick sanity checks"
]
timeout = 5

[tool.coverage.run]
branch = true
omit = ["camt053/__main__.py"]

[tool.coverage.report]
exclude_also = [
    "pragma: no cover",
    "if sys.platform",
    "except Exception:",
    "except \\(RuntimeError, OSError\\)",
]

[tool.interrogate]
fail-under = 100
ignore-init-module = true
ignore-magic = true
verbose = 1

# Mutation testing (#26). Advisory only -- this is *not* a blocking gate.
# mutmut mutates the package source and re-runs the suite to surface tests that
# pass even when the code is broken. Run with ``mutmut run`` (see CONTRIBUTING).
# Benchmarks are excluded from the test selection so each mutant is checked
# quickly; ``--no-cov`` avoids the 100% coverage gate aborting mutant runs.
[tool.mutmut]
source_paths = ["camt053"]
# mutmut's covered-lines pre-pass re-runs the suite under its own coverage and
# clashes with this project's ``--cov-fail-under=100`` gate; disable it so the
# advisory run starts cleanly. Mutants are still generated for the whole package.
mutate_only_covered_lines = false
# The two filesystem tests below ``monkeypatch.chdir`` into a temp directory,
# which trips mutmut 3.x's relative-``source_paths`` resolution during a mutant
# run; they are deselected from the mutation suite (they still run in the normal
# coverage-gated suite). Benchmarks (``perf``) are excluded for speed, and
# ``--no-cov`` keeps the 100% coverage gate from aborting each mutant run.
# ``pytest_add_cli_args`` is appended to *every* mutmut pytest invocation
# (including the per-mutant "clean test" runs that select only a subset of
# tests), so the coverage gate must be neutralised here -- ``-o addopts=``
# clears this project's ``--cov-fail-under=100`` default that would otherwise
# abort each partial run.
pytest_add_cli_args = ["-o", "addopts=", "-p", "no:cacheprovider"]
pytest_add_cli_args_test_selection = [
    "tests",
    "--deselect=tests/test_generate_xml.py",
    "--deselect=tests/test_path_validator.py",
    "-x",
    "-m",
    "not perf and not stress",
    "-q",
]
do_not_mutate = [
    "*/templates/*",
    "*/__main__.py",
]

[tool.ruff]
line-length = 79
target-version = "py311"
extend-exclude = [".github/*.md", "*.md", "docs/**/*.md", "releases/**/*.md", "tmp_env", ".venv", ".eggs"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# A standalone benchmark has to put the repository on sys.path
# before importing the package it measures, so its imports cannot
# come first.
"benches/*.py" = ["E402"]
"__init__.py" = ["F401"]
# Vendored and byte-pinned (see [tool.black]): its 3.10 tomli fallback
# is fixed in the canonical copy, not here.
"tests/test_suite_conformance.py" = ["UP036"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
check_untyped_defs = true
strict_equality = true
exclude = [
    "camt053/templates/",
    "setup.py",
    "scripts/",
    "tmp_env/",
    ".venv/",
    ".eggs/",
]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
warn_unused_ignores = false
disable_error_code = ["arg-type", "return-value", "attr-defined", "assignment"]

[[tool.mypy.overrides]]
module = ["xmlschema.*", "lxml.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# OpenTelemetry is an *optional* runtime dep (the ``camt053[telemetry]``
# extra). The telemetry module gracefully degrades to a no-op when the
# package is absent; mypy should not fail the gate just because the
# optional package isn't installed in the type-check environment.
module = "opentelemetry.*"
ignore_missing_imports = true
