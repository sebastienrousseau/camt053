name: Docs

# Build the Sphinx documentation (API reference + Design History File) and,
# on pushes to main, deploy it to GitHub Pages.
#
# Pull requests BUILD ONLY (no deploy), so a PR validates that the docs build
# cleanly without requiring Pages to be enabled on the repository.
#
# The push job enables Pages automatically (configure-pages `enablement: true`),
# so no manual Settings -> Pages step is required.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Allow the deploy job to publish to GitHub Pages via OIDC.
permissions:
  contents: read

# Allow one concurrent deployment; queue (do not cancel) in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    # `configure-pages` with `enablement: true` needs these to turn Pages on.
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install docs toolchain (hash-pinned)
        # Hash-pinned doc tooling + camt053's runtime deps. The package itself
        # is imported by autodoc from the repo root (docs/conf.py adds it to
        # sys.path), so no un-pinnable editable ``pip install -e .`` is needed.
        run: pip install --require-hashes -r requirements/docs.txt

      - name: Configure Pages
        # Only needed for the deploy path; harmless to skip on PRs.
        # `enablement: true` turns GitHub Pages on (build_type=workflow) on the
        # first run, so no manual Settings -> Pages step is required.
        if: github.event_name == 'push'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true

      - name: Build the Sphinx documentation
        # -W turns warnings into errors so a broken build fails the PR check.
        run: sphinx-build -b html -W docs _site

      - name: Check the author link on every page
        # AGENTS.md 7.1.2: every published page links the copyright name to
        # https://sebastienrousseau.com/. docs/_templates/copyright.html
        # sets it; this proves it reached the built output.
        run: |
          missing="$(grep -L -r --include='*.html' --exclude-dir=_static \
            'href="https://sebastienrousseau.com/" rel="author"' _site || true)"
          if [ -n "$missing" ]; then
            echo "pages without the author link:"
            echo "$missing"
            exit 1
          fi

      - name: Upload the Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    # Deploy only on pushes to main, never on pull requests.
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
