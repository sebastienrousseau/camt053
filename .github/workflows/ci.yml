name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Every poetry job below dies on a stale lock, but it dies inside an
  # install log with several jobs red at once and nothing saying which
  # of them is the cause. This says it in one line, in seconds, before
  # anything else runs.
  lockfile:
    name: Lockfile matches pyproject
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Poetry (hash-pinned)
        run: pip install --require-hashes -r requirements/build.txt

      - name: Verify poetry.lock is current
        run: |
          if ! poetry check --lock; then
            echo "::error::poetry.lock is stale. Run 'poetry lock' and commit the result."
            exit 1
          fi
          echo "poetry.lock matches pyproject.toml."

  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry (hash-pinned)
        run: pip install --require-hashes -r requirements/build.txt

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run tests
        run: poetry run pytest tests/ -v --tb=short

      # The benchmark asserts no timing threshold -- wall-clock is not
      # comparable between runners, and a flaky perf gate teaches
      # people to ignore red. This proves it still runs against the
      # current API rather than rotting into a file that reads as
      # verified and is not.
      - name: Run the benchmark
        run: poetry run python benches/bench_statement_pipeline.py --quick

      - name: Enforce 100% docstring coverage
        run: poetry run interrogate -c pyproject.toml camt053

      - name: Upload coverage
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: coverage.xml
          fail_ci_if_error: false

      - name: Upload coverage.xml artifact
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  smoke:
    name: Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Poetry (hash-pinned)
        run: pip install --require-hashes -r requirements/build.txt

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run smoke tests
        run: poetry run pytest tests/ -m smoke -v --no-cov --tb=short

      - name: Verify examples (all of examples/, parametrized)
        run: poetry run pytest tests/test_examples.py -v --no-cov --tb=short

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Poetry (hash-pinned)
        run: pip install --require-hashes -r requirements/build.txt

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Ruff check
        run: poetry run ruff check camt053/ tests/ scripts/ benches/

      - name: Black check
        # scripts/ was outside every formatter's scope until now.
        run: poetry run black --check camt053/ tests/ scripts/ benches/

      - name: Mypy
        run: poetry run mypy camt053/

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Poetry (hash-pinned)
        run: pip install --require-hashes -r requirements/build.txt

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Bandit
        run: poetry run bandit -r camt053/ -c pyproject.toml || poetry run bandit -r camt053/ -s B101

  audit:
    # Dependency vulnerability audit (#15). Runs pip-audit against the resolved
    # runtime + dev environment on every push/PR. Advisory
    # (``continue-on-error``) because the only outstanding findings are CVEs in
    # the runner's own ``pip`` (the build tool), not in any project runtime
    # dependency -- an unfixable transitive/toolchain issue we should surface
    # without blocking merges. The project's own dependencies audit clean.
    name: Dependency Audit (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Poetry (hash-pinned)
        run: pip install --require-hashes -r requirements/build.txt

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Install pip-audit (hash-pinned)
        run: pip install --require-hashes -r requirements/audit.txt

      - name: Run pip-audit
        # Audit the resolved Poetry environment. Findings are reported but do
        # not fail the build (job is advisory); see job comment above.
        run: poetry run pip-audit --desc

  docker-build:
    # Dockerfile validation for the REST API image (#31). PR-safe: builds the
    # image only (no registry login, no push) so a broken Dockerfile is caught
    # before release. The publish-to-GHCR step lives in docker.yml and runs on
    # release only.
    name: Docker Build (validation)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: camt053:ci

  performance:
    # Benchmark suite + performance-regression guard (#11). Runs the ``perf``
    # benchmarks (parse + reversal generation on a representative statement)
    # outside the coverage gate and compares them against the committed
    # baseline, failing only on a large (>200% mean) regression so ordinary
    # runner-to-runner hardware variance does not produce false failures.
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    # Advisory: micro-benchmarks on shared CI runners are inherently noisy, so a
    # regression here reports but never fails the build (it is not a required
    # check). Treat it as a signal, not a gate.
    continue-on-error: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Poetry (hash-pinned)
        run: pip install --require-hashes -r requirements/build.txt

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run benchmarks (regression guard)
        run: >
          poetry run pytest tests/test_benchmarks.py
          -m perf --no-cov --benchmark-only
          --benchmark-compare=.benchmarks/baseline/0001_baseline.json
          --benchmark-compare-fail=mean:200%
          --benchmark-json=benchmark-results.json
          --tb=short

      - name: Run stress suite (load / large-document / soak)
        # Load/stress tests (marker ``stress``) run alongside the benchmarks,
        # outside the coverage gate. Every bound carries a generous cushion so
        # a failure signals a real regression, not runner noise.
        run: >
          poetry run pytest tests/test_stress.py
          -m stress --no-cov -s --tb=short

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: benchmark-results
          path: benchmark-results.json

  mutation:
    # Mutation testing (#26) -- advisory, NOT a required gate. It mutates the
    # package and re-runs the suite to surface weak tests. Allowed to fail so
    # surviving mutants are informational and never block a merge.
    name: Mutation Testing (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Poetry (hash-pinned)
        run: pip install --require-hashes -r requirements/build.txt

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run mutmut (advisory)
        # Limit to the small, pure modules so the advisory run stays fast in
        # CI; drop the filter for a full local run (see CONTRIBUTING.md).
        run: |
          poetry run mutmut run "camt053.constants.*" || true
          poetry run mutmut run "camt053.models.*" || true

      - name: Mutation results summary
        if: always()
        run: poetry run mutmut results || true
