name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Every poetry job below dies on a stale lock, but it dies inside an
  # install log with several jobs red at once and nothing saying which
  # of them is the cause. This says it in one line, in seconds, before
  # anything else runs.
  lockfile:
    name: Lockfile matches pyproject
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Poetry (hash-pinned)
        run: pip install --require-hashes -r requirements/build.txt

      - name: Verify poetry.lock is current
        run: |
          if ! poetry check --lock; then
            echo "::error::poetry.lock is stale. Run 'poetry lock' and commit the result."
            exit 1
          fi
          echo "poetry.lock matches pyproject.toml."

      # pyproject.toml, __version__, constants.VERSION, the CHANGELOG
      # heading, CITATION.cff and the README's latest-release line must
      # name one version. Standard library only.
      - name: Version sources agree
        run: python3 scripts/verify_versions.py

  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python ${{ matrix.python-version }}
        id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      # Poetry runs on 3.12, the interpreter build.txt is compiled for:
      # filelock, which Poetry needs, has no fixed release for 3.10
      # (GHSA-9vhv-jxww-xfm5, GHSA-567q-5qvw-pf92, GHSA-v4x8-3wr5-3wq8 are
      # fixed in 4.2.1, which needs 3.11). The project still runs on the
      # matrix Python, through `poetry env use`.
      - name: Set up Python 3.12 for the toolchain
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Poetry (hash-pinned)
        run: python -m pip install --require-hashes -r requirements/build.txt

      - name: Use Python ${{ matrix.python-version }} for the project
        run: poetry env use "${{ steps.python.outputs.python-path }}"

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Check the project runs on Python ${{ matrix.python-version }}
        run: poetry run python -c "import sys; v = '${{ matrix.python-version }}'; assert sys.version.startswith(v + '.'), sys.version"

      - name: Run tests
        run: poetry run pytest tests/ -v --tb=short

      # The benchmark asserts no timing threshold -- wall-clock is not
      # comparable between runners, and a flaky perf gate teaches
      # people to ignore red. This proves it still runs against the
      # current API rather than rotting into a file that reads as
      # verified and is not.
      - name: Run the benchmark
        run: poetry run python benches/bench_statement_pipeline.py --quick

      - name: Enforce 100% docstring coverage
        run: poetry run interrogate -c pyproject.toml camt053

      - name: Upload coverage
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: coverage.xml
          fail_ci_if_error: false

      - name: Upload coverage.xml artifact
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  smoke:
    name: Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Poetry (hash-pinned)
        run: pip install --require-hashes -r requirements/build.txt

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run smoke tests
        run: poetry run pytest tests/ -m smoke -v --no-cov --tb=short

      - name: Verify examples (all of examples/, parametrized)
        run: poetry run pytest tests/test_examples.py -v --no-cov --tb=short

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Poetry (hash-pinned)
        run: pip install --require-hashes -r requirements/build.txt

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Ruff check
        run: poetry run ruff check camt053/ tests/ scripts/ benches/

      - name: Black check
        # scripts/ was outside every formatter's scope until now.
        run: poetry run black --check camt053/ tests/ scripts/ benches/

      - name: Mypy
        run: poetry run mypy camt053/

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Poetry (hash-pinned)
        run: pip install --require-hashes -r requirements/build.txt

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Bandit
        run: poetry run bandit -r camt053/ -c pyproject.toml || poetry run bandit -r camt053/ -s B101

  # Per-function ceilings (cyclomatic 10, cognitive 15, Halstead 30,
  # 60 lines; 500 lines per file) against complexity-baseline.json, which
  # may only shrink.
  complexity:
    name: Complexity ceilings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install radon and complexipy (hash-pinned)
        run: pip install --require-hashes -r requirements/complexity.txt
      - name: Check complexity against the baseline
        run: python scripts/check_complexity.py

  audit:
    # Dependency vulnerability audit (#15). Runs pip-audit against the resolved
    # runtime + dev environment on every push/PR, and fails on any finding.
    # It used to be advisory because the standing findings were in pip
    # itself; pip is now a floored dev dependency (>=26.2) and the
    # environment audits clean, so a new advisory is a red build, fixed by
    # constraining the dependency in pyproject.toml.
    name: Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Poetry (hash-pinned)
        run: pip install --require-hashes -r requirements/build.txt

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Install pip-audit (hash-pinned)
        run: pip install --require-hashes -r requirements/audit.txt

      - name: Run pip-audit
        # Audit the resolved Poetry environment.
        run: poetry run pip-audit --desc

      # The hash-pinned sets the other jobs install from (Poetry, the docs
      # toolchain, the fuzz build, SBOM tooling, the complexity gate).
      - name: Run pip-audit on requirements/*.txt
        run: |
          for f in requirements/*.txt; do
            echo "== $f"
            pip-audit --require-hashes --disable-pip --desc -r "$f"
          done

  docker-build:
    # Dockerfile validation for the REST API image (#31). PR-safe: builds the
    # image only (no registry login, no push) so a broken Dockerfile is caught
    # before release. The publish-to-GHCR step lives in docker.yml and runs on
    # release only.
    name: Docker Build (validation)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: camt053:ci

  performance:
    # Benchmark suite + performance-regression guard (#11). Runs the ``perf``
    # benchmarks (parse + reversal generation on a representative statement)
    # outside the coverage gate and compares them against the committed
    # baseline, failing only on a large (>200% mean) regression so ordinary
    # runner-to-runner hardware variance does not produce false failures.
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    # Advisory: micro-benchmarks on shared CI runners are inherently noisy, so a
    # regression here reports but never fails the build (it is not a required
    # check). Treat it as a signal, not a gate.
    continue-on-error: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Poetry (hash-pinned)
        run: pip install --require-hashes -r requirements/build.txt

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run benchmarks (regression guard)
        run: >
          poetry run pytest tests/test_benchmarks.py
          -m perf --no-cov --benchmark-only
          --benchmark-compare=.benchmarks/baseline/0001_baseline.json
          --benchmark-compare-fail=mean:200%
          --benchmark-json=benchmark-results.json
          --tb=short

      - name: Run stress suite (load / large-document / soak)
        # Load/stress tests (marker ``stress``) run alongside the benchmarks,
        # outside the coverage gate. Every bound carries a generous cushion so
        # a failure signals a real regression, not runner noise.
        run: >
          poetry run pytest tests/test_stress.py
          -m stress --no-cov -s --tb=short

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: benchmark-results
          path: benchmark-results.json

  mutation:
    # Mutation testing (#26) -- advisory, NOT a required gate. It mutates the
    # package and re-runs the suite to surface weak tests. Allowed to fail so
    # surviving mutants are informational and never block a merge.
    name: Mutation Testing (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Poetry (hash-pinned)
        run: pip install --require-hashes -r requirements/build.txt

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run mutmut (advisory)
        # Limit to the small, pure modules so the advisory run stays fast in
        # CI; drop the filter for a full local run (see CONTRIBUTING.md).
        run: |
          poetry run mutmut run "camt053.constants.*" || true
          poetry run mutmut run "camt053.models.*" || true

      - name: Mutation results summary
        if: always()
        run: poetry run mutmut results || true
