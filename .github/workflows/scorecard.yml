name: Scorecard supply-chain security

# OpenSSF Scorecard (#33). Runs the standard ossf/scorecard-action to assess
# the repository's supply-chain security posture and publishes the results.
#
# Deliberately does NOT trigger on pull_request: Scorecard's code-scanning
# (SARIF) findings would otherwise surface as PR checks and could block merges
# on pre-existing findings unrelated to a given change. It runs on a schedule,
# on push to the default branch, and when branch protection rules change.

on:
  schedule:
    - cron: "27 4 * * 1"
  push:
    branches: [main]
  branch_protection_rule:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Needed to upload the results to the code-scanning dashboard.
      security-events: write
      # Needed to publish results and get a badge (OIDC token).
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish results to the OpenSSF REST API so the README badge resolves
          # and the public Scorecard viewer shows the score.
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
